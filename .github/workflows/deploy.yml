name: Deploy para hospedagem via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # CI: php -l (PHP 8.2, a mesma da hospedagem) em todo .php do repositório. Todo job de deploy tem
  # `needs: verificar` — com um erro de sintaxe, nada sobe (base: biblioteca-pessoal/.github/workflows/deploy.template.yml).
  verificar:
    name: Verificar PHP (php -l)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: PHP 8.2 (a mesma versão da hospedagem)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      - name: php -l em todo .php — um erro de sintaxe trava o deploy
        run: |
          erros=0
          while IFS= read -r -d '' f; do
            php -l "$f" > /tmp/lint.txt 2>&1 || { erros=$((erros+1)); cat /tmp/lint.txt; }
          done < <(git ls-files -z '*.php')
          echo "Arquivos .php com erro de sintaxe: $erros"
          [ "$erros" -eq 0 ]

  deploy:
    needs: verificar
    name: Deploy FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar versão
        run: |
          cat > config/versao.php <<PHP
          <?php
          define('VERSAO_SISTEMA', '0.0.${{ github.run_number }}');
          define('VERSAO_COMMIT', '${GITHUB_SHA:0:7}');
          define('VERSAO_DATA', '$(date -u +"%Y-%m-%d %H:%M UTC")');
          PHP

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          # Nunca liga isso: com dangerous-clean-slate:true a action apaga TUDO que estiver
          # no server-dir e não existir no checkout do git — incluindo config/conexao.php
          # (que é gitignored de propósito) e as imagens de produto enviadas por upload.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            claude.md
            config/conexao.php
            geral/img/produtos/**
            geral/img/marca/**

name: Deploy para hospedagem via FTP

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy FTP
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Gerar versão
        run: |
          cat > config/versao.php <<PHP
          <?php
          define('VERSAO_SISTEMA', '0.0.${{ github.run_number }}');
          define('VERSAO_COMMIT', '${GITHUB_SHA:0:7}');
          define('VERSAO_DATA', '$(date -u +"%Y-%m-%d %H:%M UTC")');
          PHP

      - name: Enviar arquivos via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          protocol: ftps
          # Nunca liga isso: com dangerous-clean-slate:true a action apaga TUDO que estiver
          # no server-dir e não existir no checkout do git — incluindo config/conexao.php
          # (que é gitignored de propósito) e as imagens de produto enviadas por upload.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            claude.md
            config/conexao.php
            geral/img/produtos/**
            geral/img/marca/**
